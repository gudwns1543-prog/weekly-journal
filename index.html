<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 생활 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1c2530; --ink-soft:#54606c; --ink-faint:#94a0ab;
  --paper:#f5f7f9; --paper-2:#e9edf1; --card:#ffffff; --line:#d4dbe2;
  --line-strong:#b7c1cb;
  --accent:#2563eb; --accent-soft:#e7eefe;
  --head:#5b6772; --head-soft:#eef1f4;
  --sat:#1d4ed8; --sat-soft:#e3ebfd;
  --sun:#dc2626; --sun-soft:#fbe6e6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Pretendard',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;}
.app{display:grid; grid-template-columns:300px 1fr; min-height:100vh;}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 16px; border-right:2px solid var(--line); background:var(--card);}
.main{padding:20px 24px 80px; overflow-x:auto;}

.brand{margin-bottom:18px; padding-bottom:14px; border-bottom:3px solid var(--ink);}
.brand h1{font-size:19px; font-weight:700; letter-spacing:-.3px;}

.today-btn{width:100%; margin-bottom:12px; border:2px solid var(--accent); background:var(--card); color:var(--accent); padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;}
.today-btn:hover{background:var(--accent); color:#fff;}

.cal{background:var(--card); border:2px solid var(--line); padding:12px; margin-bottom:16px;}
.cal-head{display:flex; align-items:center; gap:5px; margin-bottom:8px;}
.cal-head .navb{width:26px; height:28px; flex-shrink:0; border:1px solid var(--line-strong); background:var(--card); cursor:pointer; color:var(--ink-soft); font-size:14px;}
.cal-head .navb:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
.cal-head .sels{display:flex; gap:4px; flex:1; justify-content:center;}
.cal-head select{border:1px solid var(--line-strong); padding:4px; font-family:inherit; font-size:13px; font-weight:700; background:var(--card); color:var(--ink); cursor:pointer;}
.cal-head select:focus{outline:none; border-color:var(--accent);}
.cal-grid{border-collapse:collapse; width:100%;}
.cal-grid th{font-size:10.5px; color:var(--ink-faint); font-weight:600; padding:4px 0;}
.cal-grid th:nth-child(6){color:var(--sat);} .cal-grid th:nth-child(7){color:var(--sun);}
.cal-grid td{padding:0; text-align:center;}
.cal-row{cursor:pointer;}
.cal-row td .cell{font-size:12px; padding:5px 0; color:var(--ink-soft);}
.cal-row td .cell.oth{color:var(--ink-faint); opacity:.5;}
.cal-row td .cell.sat{color:var(--sat);}
.cal-row td .cell.red{color:var(--sun);}
.cal-row:hover{background:var(--accent-soft);}
.cal-row.current{background:var(--head-soft); outline:2px solid var(--head); outline-offset:-2px;}
.cal-row.current td .cell{font-weight:700; color:var(--ink);}

.panel{background:var(--card); border:2px solid var(--line); padding:13px 14px; margin-bottom:14px;}
.panel .ptitle{font-size:13px; font-weight:700; margin-bottom:11px; padding-bottom:7px; border-bottom:2px solid var(--ink); display:flex; align-items:center; gap:6px;}
.tlist{display:flex; flex-direction:column; gap:5px;}
.titem{display:flex; gap:8px; align-items:center; font-size:13px; padding:2px 0;}
.titem input[type=checkbox]{accent-color:var(--accent); width:14px; height:14px; cursor:pointer; flex-shrink:0;}
.todo-ied{flex:1; border:none; border-bottom:1px solid var(--line); background:transparent; font-family:inherit; font-size:13px; color:var(--ink); padding:3px 2px; outline:none;}
.todo-ied:hover{border-bottom-color:var(--accent);}
.todo-ied:focus{border-bottom:2px solid var(--accent); background:var(--accent-soft);}
.todo-ied.doneln{color:var(--ink-faint); text-decoration:line-through;}
.todo-ied::placeholder{color:var(--ink-faint);}
.titem .del{opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:0 2px;}
.titem:hover .del{opacity:1;} .titem .del:hover{color:var(--sun);}
.addtodo{margin-top:10px; display:flex; gap:6px;}
.addtodo input{flex:1; border:1px solid var(--line-strong); padding:7px 9px; font-size:12.5px; font-family:inherit; background:var(--card);}
.addtodo input:focus{outline:none; border-color:var(--accent);}
.miniadd{border:1px solid var(--accent); background:var(--card); color:var(--accent); padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
.miniadd:hover{background:var(--accent); color:#fff;}

.habtbl{width:100%; border-collapse:collapse; font-size:11px;}
.habtbl th{font-weight:600; color:var(--ink-faint); padding:3px 1px;}
.habtbl th:nth-child(7){color:var(--sat);} .habtbl th:nth-child(8){color:var(--sun);}
.habtbl td{text-align:center; padding:5px 1px;}
.habtbl td.hname{text-align:left; white-space:nowrap;}
.hcell{width:20px; height:20px; border:1.5px solid var(--line-strong); margin:0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center; color:transparent; font-size:12px;}
.hcell.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.hab-ied{width:46px; border:none; border-bottom:1px solid transparent; background:transparent; font-family:inherit; font-size:11px; font-weight:600; color:var(--ink-soft); padding:1px; outline:none;}
.hab-ied:hover{border-bottom-color:var(--accent);}
.hab-ied:focus{border-bottom:1.5px solid var(--accent); background:var(--accent-soft); color:var(--ink);}
.habtbl .hdel{opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:11px; margin-left:2px;}
.habtbl tr:hover .hdel{opacity:1;} .habtbl .hdel:hover{color:var(--sun);}

.week-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:14px; padding-bottom:12px; border-bottom:3px solid var(--ink);}
.week-head h2{font-size:21px; font-weight:700; letter-spacing:-.5px;}
.week-head .wsub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.chip{background:var(--card); border:2px solid var(--line); padding:7px 13px;}
.chip .lab{font-size:10.5px; color:var(--ink-faint);} .chip .val{font-size:15px; font-weight:700; color:var(--accent);}
.wkbtn{width:34px; height:34px; border:2px solid var(--line); background:var(--card); cursor:pointer; font-size:18px; color:var(--ink-soft); flex-shrink:0;}
.wkbtn:hover{background:var(--accent); color:#fff; border-color:var(--accent);}

.week{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:0; min-width:1100px; border:2px solid var(--line-strong);}
.day{background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:600px; position:relative;}
.day:last-child{border-right:none;}
.day.today{outline:3px solid var(--accent); outline-offset:-3px; z-index:2;}
.day.today::before{content:"오늘"; position:absolute; top:0; right:0; background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; z-index:3;}
.dhead{padding:8px 11px; border-bottom:2px solid var(--line-strong); display:flex; align-items:center; justify-content:space-between; background:var(--head-soft);}
.dhead .dn{font-size:14px; font-weight:700; color:var(--head); display:flex; align-items:baseline; gap:5px;}
.dhead .dn .holname{font-size:10px; font-weight:600;}
.dhead .dd{font-size:11px; color:var(--ink-faint); font-weight:600;}
.day.sat .dhead{background:var(--sat); border-bottom-color:var(--sat);}
.day.sat .dhead .dn,.day.sat .dhead .dd{color:#fff;}
.day.sun .dhead{background:var(--sun); border-bottom-color:var(--sun);}
.day.sun .dhead .dn,.day.sun .dhead .dd{color:#fff;}
.dbody{padding:9px 10px 11px; display:flex; flex-direction:column; gap:7px; flex:1;}

.box{border:1px solid var(--line-strong); background:var(--card);}
.box:focus-within{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
.box .bl{font-size:10px; font-weight:700; letter-spacing:.3px; padding:3px 8px; color:#fff; background:var(--head);}
.box .bc{padding:6px 8px 7px; font-size:11.5px; line-height:1.5; color:var(--ink); text-align:left;}
.box .bc .empty{color:var(--ink-faint);}
.box[data-sec="exp"]{cursor:pointer;}
.box[data-sec="exp"]:hover{background:var(--accent-soft);}
.box[data-sec="work"] .bc{min-height:84px;}
.box[data-sec="pers"] .bc{min-height:84px;}
.box[data-sec="meal"] .bc{min-height:78px;}
.box[data-sec="exp"] .bc{min-height:58px;}
.day.sat .box .bl{background:var(--sat);}
.day.sun .box .bl{background:var(--sun);}

.ied{display:inline-block; min-width:30px; border:none; border-bottom:1px solid var(--line); background:transparent; font-family:inherit; font-size:11.5px; color:var(--ink); padding:1px 2px; outline:none;}
.ied:hover{border-bottom-color:var(--accent);}
.ied:focus{border-bottom:1.5px solid var(--accent); background:var(--accent-soft);}
.ied::placeholder{color:var(--ink-faint);}
.sched-item{display:flex; gap:4px; align-items:center; margin-bottom:3px;}
.sched-item .chk{flex-shrink:0; width:13px; height:13px; accent-color:var(--accent); cursor:pointer; margin:0;}
.sched-item .ied{flex:1;}
.sched-item .ied.doneln{text-decoration:line-through; color:var(--ink-faint);}
.sched-item .rm{opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:11px; padding:0 2px;}
.sched-item:hover .rm{opacity:1;} .sched-item .rm:hover{color:var(--sun);}
.add-item{font-size:10.5px; color:var(--accent); cursor:pointer; padding:2px 0; display:inline-block; font-weight:600;}
.add-item:hover{text-decoration:underline;}
.meal-line{display:flex; gap:6px; margin-bottom:3px; align-items:center;}
.meal-line .mk{flex:0 0 18px; font-weight:700; color:var(--ink-soft); text-align:left;}
.meal-line .ied{flex:1;}
.wtslp-grid{display:grid; grid-template-columns:auto 1fr; gap:5px 8px; align-items:center;}
.wtslp-grid .lbl{font-size:10.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600;}
.txt-in{width:100%; border:none; border-bottom:1px solid var(--line); background:transparent; font-family:inherit; font-size:11.5px; color:var(--ink); padding:2px; outline:none;}
.txt-in:hover{border-bottom-color:var(--accent);}
.txt-in:focus{border-bottom:1.5px solid var(--accent); background:var(--accent-soft);}
.txt-in::placeholder{color:var(--ink-faint);}
.exp-tag{display:inline-block; font-size:10px; background:var(--paper-2); color:var(--ink-soft); padding:1px 6px; margin:1px 3px 0 0; border:1px solid var(--line);}
.exp-edit-hint{font-size:10px; color:var(--ink-faint); margin-top:2px;}

.scrim{position:fixed; inset:0; background:rgba(20,35,55,.4); display:none; align-items:flex-start; justify-content:center; padding:34px 16px; z-index:50; overflow-y:auto;}
.scrim.open{display:flex;}
.editor{background:var(--card); width:100%; max-width:400px; border:2px solid var(--ink); box-shadow:6px 6px 0 rgba(20,35,55,.15);}
.ehead{padding:13px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center; background:var(--head);}
.ehead h3{font-size:16px; font-weight:700;}
.ehead .x{background:rgba(255,255,255,.25); border:none; color:#fff; width:27px; height:27px; cursor:pointer;}
.ebody{padding:16px 18px; max-height:64vh; overflow-y:auto;}
.subhead{font-size:13px; font-weight:700; margin:14px 0 9px; padding-bottom:5px; border-bottom:2px solid var(--ink); color:var(--ink); display:flex; align-items:center; justify-content:space-between;}
.subhead:first-child{margin-top:0;}
.subhead .mgr{font-size:11px; font-weight:600; color:var(--accent); cursor:pointer; border:1px solid var(--accent); padding:2px 8px;}
.addbtn{font-size:11.5px; color:var(--accent); background:var(--card); border:1px solid var(--accent); padding:5px 11px; cursor:pointer; font-weight:700;}
.addbtn:hover{background:var(--accent); color:#fff;}
.exp-edit{border:1px solid var(--line-strong); padding:9px; margin-bottom:8px; background:var(--paper);}
.exp-edit input, .exp-edit select{border:1px solid var(--line-strong); padding:7px 8px; font-family:inherit; font-size:13px; background:var(--card); width:100%;}
.exp-edit input:focus, .exp-edit select:focus{outline:none; border-color:var(--accent);}
.exp-edit .srm{border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:12px;}
.exp-edit .srm:hover{color:var(--sun);}
.g2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
.efoot{padding:12px 18px 16px; display:flex; gap:8px; justify-content:flex-end; border-top:2px solid var(--line); align-items:center;}
.btn{border:none; padding:9px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;}
.btn.ghost{background:var(--paper-2); color:var(--ink-soft);} .btn.solid{background:var(--accent); color:#fff;}
.btn.solid:hover{background:#1d4ed8;}
.catmgr{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.catpill{display:flex; align-items:center; gap:4px; border:1px solid var(--line-strong); background:var(--paper); padding:4px 5px 4px 11px; font-size:12px;}
.catpill .cx{border:none; background:none; cursor:pointer; color:var(--ink-faint); font-size:13px; line-height:1;}
.catpill .cx:hover{color:var(--sun);}
.catadd{display:flex; gap:6px; margin-top:4px;}
.catadd input{flex:1; border:1px solid var(--line-strong); padding:7px 9px; font-family:inherit; font-size:13px; background:var(--card);}
.catadd input:focus{outline:none; border-color:var(--accent);}
@media(max-width:760px){
  .app{grid-template-columns:1fr;}
  .side{position:static; height:auto; border-right:none; border-bottom:2px solid var(--line);}
}
/* login overlay */
.login-scrim{position:fixed; inset:0; background:#f5f7f9; display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.login-card{background:var(--card); border:2px solid var(--ink); padding:40px 36px; max-width:380px; width:100%; box-shadow:8px 8px 0 rgba(20,35,55,.12);}
.login-card h1{font-size:22px; font-weight:700; margin-bottom:6px; letter-spacing:-.4px;}
.login-card p{font-size:13px; color:var(--ink-soft); margin-bottom:22px; line-height:1.6;}
.gbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px; border:2px solid var(--ink); background:var(--card); color:var(--ink); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
.gbtn:hover{background:var(--ink); color:#fff;}
.gbtn svg{width:18px; height:18px;}
.login-err{margin-top:14px; padding:10px 12px; background:var(--sun-soft); color:var(--sun); font-size:12px; border:1px solid var(--sun); display:none;}
.login-err.show{display:block;}
.loading-scrim{position:fixed; inset:0; background:#f5f7f9; display:flex; align-items:center; justify-content:center; z-index:100; font-size:13px; color:var(--ink-soft);}
/* user badge in sidebar */
.userbar{display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:8px 10px; border:1px solid var(--line); background:var(--paper); font-size:12px;}
.userbar .uemail{flex:1; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.userbar .signout{border:none; background:none; color:var(--accent); cursor:pointer; font-size:11px; font-weight:600;}
.userbar .signout:hover{text-decoration:underline;}
.sync-pill{position:fixed; bottom:14px; right:18px; background:var(--ink); color:#fff; padding:6px 12px; font-size:11px; font-weight:600; z-index:90; opacity:0; transition:opacity .2s; pointer-events:none;}
.sync-pill.show{opacity:.85;}
</style>
</head>
<body>

<!-- 로딩 화면 -->
<div class="loading-scrim" id="loadingScrim">불러오는 중…</div>

<!-- 로그인 화면 -->
<div class="login-scrim" id="loginScrim" style="display:none;">
  <div class="login-card">
    <h1>주간 생활 일지</h1>
    <p>일정·식사·체중·수면·지출을 한 페이지에 기록합니다.<br>구글 계정으로 로그인하면 어느 기기에서나 동일한 기록을 보실 수 있어요.</p>
    <button class="gbtn" id="googleSignIn">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.32A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.32z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.99 8.99 0 0 0 9 0 9 9 0 0 0 .96 4.96l3.01 2.32C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Google로 로그인
    </button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 동기화 상태 표시 -->
<div class="sync-pill" id="syncPill">저장 중…</div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="side">
    <div class="userbar" id="userbar">
      <span class="uemail" id="uemail"></span>
      <button class="signout" id="signOutBtn">로그아웃</button>
    </div>
    <div class="brand">
      <div><h1>주간 생활 일지</h1></div>
    </div>
    <button class="today-btn" id="todayBtn">● 오늘로 돌아가기</button>
    <div class="cal">
      <div class="cal-head">
        <button class="navb" id="calPrev" aria-label="이전 달">‹</button>
        <div class="sels">
          <select id="calYear"></select>
          <select id="calMon"></select>
        </div>
        <button class="navb" id="calNext" aria-label="다음 달">›</button>
      </div>
      <table class="cal-grid" id="calGrid"></table>
    </div>
    <div class="panel todo">
      <div class="ptitle">◆ 이번주 할 일</div>
      <div class="tlist" id="todolist"></div>
      <div class="addtodo">
        <input type="text" id="newtodo" placeholder="할 일 추가…">
        <button class="miniadd" id="addtodobtn">＋</button>
      </div>
    </div>
    <div class="panel habit">
      <div class="ptitle">● 습관 트래커</div>
      <table class="habtbl" id="habtbl"></table>
      <div style="display:flex; gap:6px; margin-top:9px;">
        <input type="text" id="newhab" placeholder="이 주에 습관 추가…" style="flex:1; border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12.5px; font-family:inherit; background:var(--paper);">
        <button class="miniadd" id="addhabbtn" style="border-color:var(--sage); background:var(--sage-soft); color:var(--sage);">＋</button>
      </div>
      <p style="font-size:10.5px; color:var(--ink-faint); margin-top:5px; line-height:1.4;">습관을 빼면 이 주부터만 사라지고 과거 기록은 보존됩니다.</p>
    </div>
  </aside>
  <main class="main">
    <div class="week-head">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="wkbtn" id="wkPrev" aria-label="이전 주">‹</button>
        <div><h2 class="serif" id="weekTitle"></h2><div class="wsub" id="weekSub"></div></div>
        <button class="wkbtn" id="wkNext" aria-label="다음 주">›</button>
      </div>
      <div class="chip"><div class="lab">주간 지출</div><div class="val" id="weektotal">₩0</div></div>
    </div>
    <div id="weeksContainer" style="margin-top:16px;"></div>
  </main>
</div>

<div class="scrim" id="scrim">
  <div class="editor">
    <div class="ehead" id="ehead">
      <h3 id="etitle">기록</h3>
      <button class="x" id="eclose">✕</button>
    </div>
    <div class="ebody" id="ebody"></div>
    <div class="efoot">
      <button class="btn ghost" id="ecancel">취소</button>
      <button class="btn solid" id="esave">저장</button>
    </div>

function blankLog(){return {work:[], pers:[], meals:{b:'',l:'',d:'',s:'',n:''}, wtAm:'',wtPm:'',wake:'',sleep:'', exr:[], exp:[]};}
function normItems(arr){ // accept ['text'] or [{t,done}] -> [{t,done}]
  if(!Array.isArray(arr)) return [];
  return arr.map(x=> typeof x==='string' ? {t:x,done:false} : {t:(x.t||''),done:!!x.done});
}
function getLog(k){
  if(!logs[k]) logs[k]=blankLog();
  const L=logs[k];
  L.work=normItems(L.work); L.pers=normItems(L.pers);
  if(typeof L.exr==='string') L.exr = L.exr ? [{t:L.exr,done:false}] : [];
  else L.exr=normItems(L.exr);
  return L;
}
function getTodos(wk){ if(!todosByWeek[wk]) todosByWeek[wk]=[]; return todosByWeek[wk]; }
// per-week habits: inherit from the most recent prior week that has data
function getHabits(wk){
  if(habitsByWeek[wk]) return habitsByWeek[wk];
  // find previous week with habits to inherit the set (not the checks)
  let prevMon=new Date(new Date(wk+'T00:00:00').getTime()-7*MS_DAY);
  let inheritOrder=null;
  for(let i=0;i<260;i++){ // look back up to ~5 years
    const pk=keyOf(prevMon);
    if(habitsByWeek[pk]){ inheritOrder=[...habitsByWeek[pk].order]; break; }
    prevMon=new Date(prevMon.getTime()-7*MS_DAY);
  }
  const order=inheritOrder||[...DEFAULT_HABITS];
  const data={}; order.forEach(n=>data[n]=[0,0,0,0,0,0,0]);
  habitsByWeek[wk]={order, data};
  return habitsByWeek[wk];
}

function renderCal(){
  // year dropdown: range around today, wide enough for 2021..future
  const ySel=document.getElementById('calYear'); const mSel=document.getElementById('calMon');
  const baseY=2021, endY=TODAY.getFullYear()+3;
  if(ySel.options.length===0){
    for(let y=baseY;y<=endY;y++) ySel.add(new Option(y+'년', y));
    MONTHS.forEach((m,i)=>mSel.add(new Option(m, i)));
  }
  ySel.value=calMonth.getFullYear(); mSel.value=calMonth.getMonth();

  const first=new Date(calMonth.getFullYear(),calMonth.getMonth(),1);
  const last=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0);
  // start one week BEFORE the week containing the 1st; end one week AFTER the week containing the last day
  let cursor=new Date(mondayOf(first).getTime()-7*MS_DAY);
  const endMon=new Date(mondayOf(last).getTime()+7*MS_DAY);
  const curKey=weekKey(curMonday);
  const todayKey=keyOf(TODAY);
  let html='<tr>'+WD.map(d=>`<th>${d}</th>`).join('')+'</tr>';
  while(cursor.getTime()<=endMon.getTime()){
    const rowMon=new Date(cursor.getTime());
    const rk=weekKey(rowMon);
    html+=`<tr class="cal-row ${rk===curKey?'current':''}" data-wk="${rk}">`;
    for(let c=0;c<7;c++){
      const day=new Date(cursor.getTime()); cursor=new Date(cursor.getTime()+MS_DAY);
      const oth=day.getMonth()!==calMonth.getMonth();
      const isToday=keyOf(day)===todayKey;
      const isRed = c===6 || !!holidayName(keyOf(day));
      const isSat = c===5;
      let cls='cell'+(oth?' oth':'')+(isRed?' red':'')+(isSat?' sat':'');
      html+=`<td><div class="${cls}" ${isToday?'style="background:var(--accent);color:#fff;font-weight:700;"':''}>${day.getDate()}</div></td>`;
    }
    html+='</tr>';
  }
  const g=document.getElementById('calGrid'); g.innerHTML=html;
  g.querySelectorAll('.cal-row').forEach(row=>{
    row.onclick=()=>{
      const mon=mondayOf(new Date(row.dataset.wk+'T00:00:00'));
      curMonday=mon;
      // switch the calendar month to the month that this week mostly belongs to (use Thursday = midweek)
      const mid=new Date(mon.getTime()+3*MS_DAY);
      calMonth=new Date(mid.getFullYear(), mid.getMonth(), 1);
      renderAll();
    };
  });
}

        <span class="lbl">저녁 체중</span><input class="txt-in" data-k="${k}" data-fld="wtPm" value="${esc(L.wtPm)}" placeholder="">
        <span class="lbl">기상</span><input class="txt-in" data-k="${k}" data-fld="wake" value="${esc(L.wake)}" placeholder="예: 9시 30분">
        <span class="lbl">취침</span><input class="txt-in" data-k="${k}" data-fld="sleep" value="${esc(L.sleep)}" placeholder="예: 새벽 2시">
      </div>`;

    // exercise — list like work/pers
    const exrInner=listInner(L.exr,'exr');

    // expense — kept as modal
    const tot=dayExpTotal(L);
    const expInner=(L.exp&&L.exp.length)
      ? L.exp.map(e=>`<span class="exp-tag">${e.cat||''} ${(+e.amt).toLocaleString()}</span>`).join('')+`<div class="exp-edit-hint">클릭하여 편집</div>`
      : `<span class="empty">클릭하여 추가</span>`;

    card.innerHTML=`
      <div class="dhead"><span class="dn">${WD[i]}${hol?`<span class="holname">${hol}</span>`:''}</span><span class="dd">${pad(date.getMonth()+1)}.${pad(date.getDate())}</span></div>
      <div class="dbody">
        <div class="box" data-sec="work"><div class="bl">업무</div><div class="bc">${listInner(L.work,'work')}</div></div>
        <div class="box" data-sec="pers"><div class="bl">개인</div><div class="bc">${listInner(L.pers,'pers')}</div></div>
        <div class="box" data-sec="meal"><div class="bl">식사</div><div class="bc">${mealInner}</div></div>
        <div class="box" data-sec="wtslp"><div class="bl">체중 · 수면</div><div class="bc">${wtslpInner}</div></div>
        <div class="box" data-sec="exr"><div class="bl">운동</div><div class="bc">${exrInner}</div></div>
        <div class="box expbox" data-k="${k}" data-sec="exp"><div class="bl">지출 ${tot?fmtWon(tot):''}</div><div class="bc">${expInner}</div></div>
      </div>`;
    wk.appendChild(card);
  }
  // wire inline editing after DOM insert
  setTimeout(()=>wireInline(wk),0);
  return wk;
}

function wireInline(scope){
  // list items (work/pers/exr) text
  scope.querySelectorAll('.ied[data-idx]').forEach(inp=>{
    inp.onchange=()=>{ const L=getLog(inp.dataset.k); L[inp.dataset.sec][+inp.dataset.idx].t=inp.value.trim(); saveState(); };
    inp.onkeydown=e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault();
        const L=getLog(inp.dataset.k); const sec=inp.dataset.sec; L[sec][+inp.dataset.idx].t=inp.value.trim();
        // Enter = save this row AND add a new empty row below for fast entry
        L[sec].push({t:'',done:false}); saveState(); renderMain();
        setTimeout(()=>{ const inps=document.querySelectorAll(`.ied[data-k="${inp.dataset.k}"][data-sec="${sec}"]`); if(inps.length)inps[inps.length-1].focus(); },20);
      }
      // Shift+Enter: allow default (does nothing special in single-line input, but we keep focus = newline-like continuation)
    };
  });
  // checkboxes
  scope.querySelectorAll('.chk').forEach(c=>{
    c.onchange=()=>{ const L=getLog(c.dataset.k); L[c.dataset.sec][+c.dataset.idx].done=c.checked; saveState(); renderMain(); };
  });
  scope.querySelectorAll('.rm[data-idx]').forEach(btn=>{
    btn.onclick=()=>{ const L=getLog(btn.dataset.k); L[btn.dataset.sec].splice(+btn.dataset.idx,1); saveState(); renderMain(); };
  });
  scope.querySelectorAll('.add-item').forEach(btn=>{
    btn.onclick=()=>{ const L=getLog(btn.dataset.k); (L[btn.dataset.sec]=L[btn.dataset.sec]||[]).push({t:'',done:false}); saveState(); renderMain();
      setTimeout(()=>{ const inps=document.querySelectorAll(`.ied[data-k="${btn.dataset.k}"][data-sec="${btn.dataset.sec}"]`); if(inps.length)inps[inps.length-1].focus(); },20);
    };
  });
  // meals
  scope.querySelectorAll('.ied[data-meal]').forEach(inp=>{
    inp.onchange=()=>{ getLog(inp.dataset.k).meals[inp.dataset.meal]=inp.value.trim(); saveState(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ inp.blur(); } };
  });
  // simple text fields (wtAm/wtPm/wake/sleep)
  scope.querySelectorAll('.txt-in[data-fld]').forEach(inp=>{
    inp.onchange=()=>{ getLog(inp.dataset.k)[inp.dataset.fld]=inp.value.trim(); saveState(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ inp.blur(); } };
  });
  // expense box -> modal
  scope.querySelectorAll('.expbox').forEach(b=>{
    b.onclick=e=>{ if(e.target.closest('.bc')||e.target.closest('.bl')) openExpense(b.dataset.k); };
  });
}

function renderMain(){
  const mon=curMonday;
  const end=new Date(mon.getTime()+6*MS_DAY);
  document.getElementById('weekTitle').textContent=
    `${mon.getFullYear()}.${pad(mon.getMonth()+1)}.${pad(mon.getDate())} — ${pad(end.getMonth()+1)}.${pad(end.getDate())}`;
  const jan1=new Date(mon.getFullYear(),0,1);
  const wkNo=Math.ceil((((mon-jan1)/MS_DAY)+jan1.getDay()+1)/7);
  document.getElementById('weekSub').textContent=`${wkNo}주차`;
  let total=0;
  for(let i=0;i<7;i++){total+=dayExpTotal(getLog(keyOf(new Date(mon.getTime()+i*MS_DAY))));}
  document.getElementById('weektotal').textContent=fmtWon(total);
  const c=document.getElementById('weeksContainer'); c.innerHTML='';
  c.appendChild(renderWeekBlock(mon));
}

let scrollLock=false;
window.addEventListener('wheel',(e)=>{
  if(document.getElementById('scrim').classList.contains('open')) return;
  if(scrollLock) return;
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return;
  const atTop=window.scrollY<=2;
  const atBottom=Math.abs(window.innerHeight+window.scrollY-document.body.scrollHeight)<3;
  const fits=document.body.scrollHeight<=window.innerHeight+4;
  if(e.deltaY>28 && (atBottom||fits)){
    scrollLock=true; curMonday=new Date(curMonday.getTime()+7*MS_DAY);
    calMonth=new Date(curMonday.getFullYear(),curMonday.getMonth(),1); renderAll();
    setTimeout(()=>scrollLock=false,300);
  }else if(e.deltaY<-28 && (atTop||fits)){
    scrollLock=true; curMonday=new Date(curMonday.getTime()-7*MS_DAY);
    calMonth=new Date(curMonday.getFullYear(),curMonday.getMonth(),1); renderAll();
    setTimeout(()=>scrollLock=false,300);
  }
},{passive:true});

let editKey=null;
function openExpense(k){
  editKey=k; const L=getLog(k);
  const date=new Date(k+'T00:00:00'); const wdIdx=(date.getDay()+6)%7;
  document.getElementById('ehead').style.background='linear-gradient(120deg,#0e7490,#155e75)';
  document.getElementById('etitle').textContent=`${WD[wdIdx]} ${pad(date.getMonth()+1)}.${pad(date.getDate())} · 지출`;
  const body=document.getElementById('ebody');
  body.innerHTML=`
    <div class="subhead">지출 항목 <button class="addbtn" id="addExp">＋ 추가</button></div>
    <div id="expList"></div>
    <div class="subhead">분류 관리 <span class="mgr" id="toggleCat">구매처/카테고리 편집</span></div>
    <div id="catPanel" style="display:none;"></div>`;
  const el=document.getElementById('expList');
  (L.exp||[]).forEach(e=>el.appendChild(expRow(e)));
  if(!L.exp||!L.exp.length) el.appendChild(expRow());
  document.getElementById('addExp').onclick=()=>el.appendChild(expRow());
  document.getElementById('toggleCat').onclick=()=>{
    const p=document.getElementById('catPanel');
    p.style.display=p.style.display==='none'?'block':'none';
    if(p.style.display==='block') renderCatMgr();
  };
  document.getElementById('scrim').classList.add('open');
  setTimeout(()=>{ const f=body.querySelector('input'); if(f)f.focus(); },60);
}
const esc=v=>(v||'').replace(/"/g,'&quot;');
function expRow(e={}){
  const w=document.createElement('div'); w.className='exp-edit';
  w.innerHTML=`
    <div class="g2" style="margin-bottom:6px;">
      <input type="text" class="ex-name" placeholder="항목 (예: 영양제)" value="${esc(e.name)}">
      <input type="number" class="ex-amt" placeholder="금액" value="${e.amt||''}">
    </div>
    <div class="g3" style="margin-bottom:6px;">
      <select class="ex-ch">${EXP_CHANNEL.map(c=>`<option ${e.ch===c?'selected':''}>${c}</option>`).join('')}</select>
      <select class="ex-store">${EXP_STORE.map(c=>`<option ${e.store===c?'selected':''}>${c}</option>`).join('')}</select>
      <select class="ex-cat">${EXP_CATEGORY.map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <button class="srm" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:12px;">✕ 이 항목 삭제</button>`;
  w.querySelector('.srm').onclick=()=>w.remove();
  return w;
}

function renderCatMgr(){
  const p=document.getElementById('catPanel');
  const block=(title,arr,id)=>`
    <div style="margin-bottom:12px;">
      <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">${title}</div>
      <div class="catmgr" id="mgr-${id}">${arr.map(c=>`<span class="catpill">${c}<button class="cx" data-arr="${id}" data-v="${c}">✕</button></span>`).join('')}</div>
      <div class="catadd"><input type="text" id="add-${id}" placeholder="새 ${title} 추가"><button class="addbtn" data-add="${id}">추가</button></div>
    </div>`;
  p.innerHTML=block('채널',EXP_CHANNEL,'ch')+block('구매처',EXP_STORE,'store')+block('카테고리',EXP_CATEGORY,'cat');
  const arrs={ch:EXP_CHANNEL,store:EXP_STORE,cat:EXP_CATEGORY};
  p.querySelectorAll('.cx').forEach(b=>b.onclick=()=>{
    const a=arrs[b.dataset.arr]; const idx=a.indexOf(b.dataset.v); if(idx>-1)a.splice(idx,1); saveState(); renderCatMgr(); refreshExpSelects();
  });
  p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.add; const inp=document.getElementById('add-'+id); const v=inp.value.trim();
    if(v && !arrs[id].includes(v)){arrs[id].push(v); inp.value=''; saveState(); renderCatMgr(); refreshExpSelects();}
  });
}
function refreshExpSelects(){
  document.querySelectorAll('#expList .exp-edit').forEach(r=>{
    const setOpts=(sel,arr)=>{const cur=sel.value; sel.innerHTML=arr.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('');};
    setOpts(r.querySelector('.ex-ch'),EXP_CHANNEL);
    setOpts(r.querySelector('.ex-store'),EXP_STORE);
    setOpts(r.querySelector('.ex-cat'),EXP_CATEGORY);
  });
}

function closeEditor(){document.getElementById('scrim').classList.remove('open');}
document.getElementById('eclose').onclick=closeEditor;
document.getElementById('ecancel').onclick=closeEditor;
document.getElementById('scrim').onclick=e=>{if(e.target.id==='scrim')closeEditor();};

document.getElementById('esave').onclick=()=>{
  const L=getLog(editKey);
  L.exp=[...document.querySelectorAll('#expList .exp-edit')].map(r=>({
    name:r.querySelector('.ex-name').value.trim(), amt:+r.querySelector('.ex-amt').value||0,
    ch:r.querySelector('.ex-ch').value, store:r.querySelector('.ex-store').value, cat:r.querySelector('.ex-cat').value
  })).filter(e=>e.name||e.amt);
  saveState(); closeEditor(); renderMain();
};

function renderAll(){
  renderCal(); renderTodos(); renderHabits(); renderMain();
}
</script>
